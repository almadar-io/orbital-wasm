[package]
name = "orbital-wasm"
version = "18.0.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/almadar-io/orbital-wasm"
description = "The embedded Almadar kernel for JavaScript hosts (npm @almadar/kernel): wasm-bindgen marshalling over orbital_core::embed"

[lib]
name = "orbital_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
orbital-core = { git = "https://github.com/almadar-io/orbital-core", branch = "main" }
serde_json = "1.0"
wasm-bindgen = "=0.2.126"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
orbital-core = { git = "https://github.com/almadar-io/orbital-core", branch = "main", features = ["native-transport"] }

[package]
name = "orbital-wasm"
version = "18.0.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/almadar-io/orbital-wasm"
description = "The embedded Almadar kernel for JavaScript hosts (npm @almadar/kernel): wasm-bindgen marshalling over orbital_core::embed"

[features]
default = ["full"]
# The full kernel: Node hosts and tools. The client build (`--no-default-features`) is what a browser loads.
full = ["wire-drivers"]
# Postgres and Redis over raw sockets; a browser cannot open them.
wire-drivers = ["orbital-core/wire-drivers"]

[lib]
name = "orbital_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
orbital-core = { git = "https://github.com/almadar-io/orbital-core", branch = "main", default-features = false }
serde_json = "1.0"
wasm-bindgen = "=0.2.126"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
orbital-core = { git = "https://github.com/almadar-io/orbital-core", branch = "main", default-features = false, features = ["native-transport"] }

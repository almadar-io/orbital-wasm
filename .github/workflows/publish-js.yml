name: Publish @almadar/kernel to npm

on:
  push:
    tags:
      - 'js-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown

      # Ubuntu's binaryen is too old: its -O3 pass leaves a table the wasm-bindgen glue cannot grow. The
      # kernel is built and tested with the same release a developer machine has.
      - name: Install wasm-bindgen and binaryen
        run: |
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: js
        run: sh scripts/build.sh

      - name: Publish
        working-directory: js
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
